<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vesper</title>
<style>
  :root {
    --void: #000; --blaze: #ff6a00; --amber: #ffb000; --text: #ffe8d2; --dim: #c07a45; --line: #4a2408;
    --ion: #38e8ff; --alarm: #ff2a4d;
    --glow: 0 0 6px rgba(255, 106, 0, .85), 0 0 22px rgba(255, 106, 0, .35);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { background: var(--void); }
  body {
    margin: 0; min-height: 100vh; color: var(--text);
    font: 16px/1.4 Bahnschrift, "DIN Alternate", "Roboto Condensed", "Segoe UI", system-ui, sans-serif;
    font-variant-numeric: tabular-nums;
    background:
      radial-gradient(1px 1px at 12% 18%, rgba(255, 232, 210, .7), transparent 2px),
      radial-gradient(1px 1px at 31% 72%, rgba(255, 232, 210, .45), transparent 2px),
      radial-gradient(1.5px 1.5px at 47% 9%, rgba(255, 232, 210, .6), transparent 2px),
      radial-gradient(1px 1px at 64% 41%, rgba(255, 232, 210, .4), transparent 2px),
      radial-gradient(1.5px 1.5px at 78% 83%, rgba(255, 232, 210, .55), transparent 2px),
      radial-gradient(1px 1px at 91% 27%, rgba(255, 232, 210, .6), transparent 2px),
      radial-gradient(1px 1px at 22% 94%, rgba(255, 232, 210, .4), transparent 2px),
      radial-gradient(60vw 50vh at 100% 0, rgba(255, 106, 0, .13), transparent 70%),
      var(--void);
    background-attachment: fixed;
  }
  button, input, select { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--ion); outline-offset: 2px; }

  /* top bar */
  .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 20px; padding: 14px 24px; }
  .brand { display: flex; align-items: center; gap: 10px; margin: 0; font-size: 22px; font-weight: 600;
           color: var(--blaze); text-shadow: var(--glow); }
  .core { width: 12px; height: 12px; border-radius: 50%; background: var(--dim); }
  .core.live { background: var(--blaze); box-shadow: var(--glow); }
  .core.lost { background: var(--alarm); box-shadow: 0 0 10px var(--alarm); }
  .bar .who { color: var(--text); }
  .bar .sub { color: var(--dim); }
  #stale { margin-left: auto; color: var(--dim); }
  #stale.bad { color: var(--alarm); }
  #gear { min-height: 40px; padding: 0 20px; background: transparent; border: 1px solid var(--blaze); color: var(--blaze); cursor: pointer; }
  #gear:hover { background: var(--blaze); color: var(--void); }

  /* a threat takes over the top of the page */
  #alarm { margin: 0 24px 8px; padding: 12px 18px; font-size: 20px; color: var(--void); background: var(--alarm);
           box-shadow: 0 0 26px rgba(255, 42, 77, .65); }

  /* cockpit */
  #cockpit { display: grid; gap: 28px 44px; padding: 10px 24px 40px; grid-template-columns: minmax(0, 1fr) minmax(280px, 400px);
             grid-template-areas: "bridge comms" "logs comms"; align-items: start; }
  .bridge { grid-area: bridge; min-width: 0; }
  .comms { grid-area: comms; min-width: 0; }
  .logs { grid-area: logs; display: grid; gap: 28px 44px; min-width: 0;
          grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); align-items: start; }
  #system { margin: 0; font-size: clamp(44px, 7.5vw, 104px); line-height: 1; font-weight: 300; font-stretch: 75%;
            color: var(--blaze); text-shadow: var(--glow); overflow-wrap: anywhere; }
  #where { margin: 8px 0 0; font-size: 20px; }
  #target, #vr { margin: 6px 0 0; color: var(--dim); }
  .flags { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .flags:empty { display: none; }
  .flags span { padding: 2px 10px; color: var(--void); background: var(--amber); }

  .instruments { display: flex; flex-wrap: wrap; align-items: center; gap: 20px 36px; margin-top: 26px; }
  .ring { width: 224px; height: 224px; flex: none; }
  .ring circle { fill: none; stroke-width: 9; transform: rotate(135deg); transform-origin: 100px 100px; }
  .ring .track { stroke: var(--line); stroke-dasharray: 75 100; }
  .ring .arc { stroke-dasharray: 0 100; transition: stroke-dasharray .6s ease-out; }
  .ring .hull { stroke: var(--blaze); filter: drop-shadow(0 0 5px var(--blaze)); }
  .ring .fuel { stroke: var(--amber); filter: drop-shadow(0 0 4px var(--amber)); }
  .ring .cargo { stroke: var(--text); }
  .ring .arc.low { stroke: var(--alarm); filter: drop-shadow(0 0 6px var(--alarm)); }
  .ring text { fill: var(--text); text-anchor: middle; font-size: 34px; font-weight: 300; }
  .ring text.small { fill: var(--dim); font-size: 13px; }
  .ship { min-width: 220px; flex: 1 1 220px; }
  .ship h2 { margin: 0; color: var(--text); font-size: 26px; font-weight: 400; overflow-wrap: anywhere; }
  .ship .type { color: var(--dim); margin-bottom: 10px; }
  .row { display: flex; justify-content: space-between; gap: 14px; padding: 3px 0; }
  .row > :last-child { text-align: right; }
  .key::before { content: ""; display: inline-block; width: 10px; height: 10px; margin-right: 8px; }
  .key.hull::before { background: var(--blaze); } .key.fuel::before { background: var(--amber); }
  .key.cargo::before { background: var(--text); }
  .pips { display: flex; gap: 18px; }
  .pip { text-align: center; color: var(--dim); }
  .pip .stack { display: flex; flex-direction: column-reverse; gap: 4px; width: 34px; height: 92px; margin: 0 auto 6px; }
  .pip .stack b { flex: 1; background: var(--line); transform: skewX(-14deg); }
  .pip .stack b.half { background: linear-gradient(90deg, var(--blaze) 50%, var(--line) 50%); }
  .pip .stack b.on { background: var(--blaze); box-shadow: 0 0 8px rgba(255, 106, 0, .8); }

  .head { display: flex; align-items: center; gap: 12px; margin: 0 0 10px; color: var(--blaze); font-size: 18px; font-weight: 400; }
  .head::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, var(--blaze), transparent); }
  .dim { color: var(--dim); }
  ol { margin: 0; padding-left: 24px; }
  li { padding: 2px 0; overflow-wrap: anywhere; }
  li .star { margin-left: 8px; color: var(--dim); font-size: 14px; }
  li .scoop { color: var(--amber); }
  .mission { padding: 6px 0; }
  .mission .when { white-space: nowrap; }
  .soon { color: var(--amber); } .urgent { color: var(--alarm); } .ready { color: var(--ion); }
  .conv { max-height: calc(100vh - 150px); overflow: auto; overscroll-behavior: contain; scrollbar-width: thin; scrollbar-color: var(--blaze) transparent; }
  .conv p { margin: 0 0 10px; overflow-wrap: anywhere; }
  .conv time { display: block; color: var(--dim); font-size: 13px; }
  .conv .you { color: var(--ion); } .conv .callout { color: var(--amber); }
  .empty { color: var(--dim); margin: 0; }

  /* settings: one group at a time */
  #settings { display: grid; gap: 20px 44px; padding: 16px 24px 40px; grid-template-columns: 220px minmax(0, 720px); align-items: start; }
  .rail { display: flex; flex-direction: column; gap: 2px; position: sticky; top: 12px; }
  .rail button { min-height: 42px; padding: 0 14px; text-align: left; background: transparent; border: 0; border-left: 2px solid var(--line);
                 color: var(--dim); cursor: pointer; font-size: 18px; }
  .rail button:hover { color: var(--text); }
  .rail button[aria-current="true"] { color: var(--blaze); border-left-color: var(--blaze); text-shadow: var(--glow); }
  .pane h2 { margin: 0 0 14px; color: var(--blaze); font-size: 34px; font-weight: 300; text-shadow: var(--glow); }
  .notice { margin: 0 0 14px; color: var(--amber); }
  .set { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 290px); gap: 4px 24px; align-items: center; min-height: 56px; padding: 8px 0;
         border-top: 1px solid var(--line); }
  .set label { display: block; }
  .set small { display: block; color: var(--dim); font-size: 14px; overflow-wrap: anywhere; }
  .set .how { display: flex; align-items: center; justify-content: flex-end; gap: 12px; min-width: 0; }
  .set .said { grid-column: 1 / -1; text-align: right; }
  .set .ok { color: var(--ion); } .set .err { color: var(--alarm); } .set .later { color: var(--amber); }
  .set select, .set input[type=text], .set input[type=number] {
    width: 100%; min-height: 40px; padding: 4px 8px; background: var(--void); border: 0; border-bottom: 1px solid var(--blaze); border-radius: 0; }
  .set input[type=number] { max-width: 120px; text-align: right; }
  .set select option, .set select optgroup { background: var(--void); color: var(--text); }
  .set input[type=checkbox] { appearance: none; width: 52px; height: 26px; margin: 0; flex: none; position: relative; cursor: pointer;
                              background: transparent; border: 1px solid var(--dim); }
  .set input[type=checkbox]::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; background: var(--dim); transition: transform .12s; }
  .set input[type=checkbox]:checked { border-color: var(--blaze); box-shadow: 0 0 10px rgba(255, 106, 0, .6); }
  .set input[type=checkbox]:checked::after { background: var(--blaze); transform: translateX(26px); }
  .set input[type=range] { width: 100%; accent-color: var(--blaze); }
  .set output { width: 3ch; flex: none; text-align: right; }
  .set :disabled { opacity: .5; cursor: not-allowed; }

  /* the one moment of motion: powering on when the page first loads */
  @keyframes power { from { opacity: 0; filter: brightness(2.4); } to { opacity: 1; filter: none; } }
  @keyframes scan { from { transform: translateY(0); opacity: 1; } to { transform: translateY(100vh); opacity: 0; } }
  #scan { position: fixed; inset: 0 0 auto; height: 2px; background: var(--blaze); box-shadow: 0 0 22px 4px var(--blaze); pointer-events: none;
          animation: scan .85s ease-in forwards; }
  #cockpit, #settings, .bar { animation: power .85s ease-out; }
  @media (prefers-reduced-motion: reduce) {
    #cockpit, #settings, .bar { animation: none; }
    #scan { display: none; }
    .ring .arc, .set input[type=checkbox]::after { transition: none; }
  }

  @media (max-width: 960px) {
    #cockpit { grid-template-columns: minmax(0, 1fr); grid-template-areas: "bridge" "logs" "comms"; }
    .conv { max-height: 420px; }
    #settings { grid-template-columns: minmax(0, 1fr); }
    .rail { position: static; flex-direction: row; overflow-x: auto; }
    .rail button { flex: none; border-left: 0; border-bottom: 2px solid var(--line); }
    .rail button[aria-current="true"] { border-bottom-color: var(--blaze); }
  }
  @media (max-width: 560px) {
    .bar, #cockpit, #settings { padding-left: 16px; padding-right: 16px; }
    #alarm { margin-left: 16px; margin-right: 16px; }
    #stale { margin-left: 0; }
    .instruments { justify-content: center; }
    .set { grid-template-columns: minmax(0, 1fr); }
    .set .how { justify-content: flex-start; }
    .set .said { text-align: left; }
  }
</style>
</head>
<body>
<div id="scan"></div>
<header class="bar">
  <h1 class="brand"><span class="core" id="core"></span>Vesper</h1>
  <span class="who" id="cmdr"></span>
  <span class="sub" id="credits"></span>
  <span class="sub" id="legal"></span>
  <span id="stale">Connecting</span>
  <button id="gear" type="button">Settings</button>
</header>
<div id="alarm" role="alert" hidden></div>
<main id="settings" hidden></main>
<main id="cockpit">
  <section class="bridge">
    <h2 id="system">No signal</h2>
    <p id="where"></p>
    <div class="flags" id="flags"></div>
    <p id="target" hidden></p>
    <p id="vr" hidden></p>
    <div class="instruments">
      <svg class="ring" viewBox="0 0 200 200" role="img" aria-label="Hull, fuel and cargo gauges">
        <circle class="track" cx="100" cy="100" r="92" pathLength="100"/><circle class="arc hull" id="hullarc" cx="100" cy="100" r="92" pathLength="100"/>
        <circle class="track" cx="100" cy="100" r="77" pathLength="100"/><circle class="arc fuel" id="fuelarc" cx="100" cy="100" r="77" pathLength="100"/>
        <circle class="track" cx="100" cy="100" r="62" pathLength="100"/><circle class="arc cargo" id="cargoarc" cx="100" cy="100" r="62" pathLength="100"/>
        <text x="100" y="108" id="hullbig">-</text><text class="small" x="100" y="128">Hull</text>
      </svg>
      <div class="ship">
        <h2 id="shipname"></h2>
        <div class="type" id="shiptype"></div>
        <div class="row"><span class="key hull">Hull</span><span id="hullv"></span></div>
        <div class="row"><span class="key fuel">Fuel</span><span id="fuelv"></span></div>
        <div class="row"><span class="key cargo">Cargo</span><span id="cargov"></span></div>
        <div class="row dim"><span>Jump range</span><span id="jump"></span></div>
        <div class="row dim"><span>Rebuy</span><span id="rebuy"></span></div>
      </div>
      <div class="pips" id="pips" role="img" aria-label="Power distributor"></div>
    </div>
  </section>
  <aside class="comms"><h2 class="head">Comms</h2><div class="conv" id="conv"></div></aside>
  <div class="logs">
    <section id="routebox" hidden><h2 class="head">Route</h2><div id="route"></div></section>
    <section id="missionbox" hidden><h2 class="head">Missions</h2><div id="missions"></div></section>
    <section id="miningbox" hidden><h2 class="head">Mining</h2><div id="mining"></div></section>
    <section id="holdbox" hidden><h2 class="head">Hold</h2><div id="hold"></div></section>
  </div>
</main>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const num = n => n == null ? "-" : Math.round(n).toLocaleString();
const FLAGS = {LowFuel: "Low fuel", OverHeating: "Overheating", BeingInterdicted: "Being interdicted", IsInDanger: "In danger",
               FsdCharging: "FSD charging", Landed: "Landed"};
function arc(id, frac, warn) {
  const f = Math.max(0, Math.min(1, frac || 0)), el = $(id);
  el.setAttribute("stroke-dasharray", `${f * 75} 100`);
  el.style.strokeDasharray = `${f * 75} 100`;
  el.classList.toggle("low", !!warn && f < 0.25);
}
function left(sec) {
  if (sec == null) return "";
  if (sec <= 0) return "Expired";
  const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60);
  return h ? `${h}h ${m}m` : `${m}m`;
}
function show(id, html) {
  $(id + "box").hidden = !html;
  if (html) $(id === "mission" ? "missions" : id).innerHTML = html;
}
function render(d) {
  if (d.error) { $("stale").textContent = d.error; return; }
  $("cmdr").textContent = "CMDR " + d.commander;
  $("credits").textContent = num(d.credits) + " cr";
  $("legal").textContent = d.legal || "";
  $("system").textContent = d.location.system || "Unknown system";
  $("where").textContent = [d.location.where, d.location.mode].filter(Boolean).join(", ");
  $("flags").innerHTML = (d.flags || []).filter(f => FLAGS[f]).map(f => `<span>${FLAGS[f]}</span>`).join("");
  $("alarm").hidden = !d.threat;
  $("alarm").textContent = d.threat || "";
  const t = d.target;
  $("target").hidden = !t;
  if (t) $("target").textContent = "Target: " + [t.pilot, t.ship, t.rank].filter(Boolean).join(", ") + (t.bounty ? `, bounty ${num(t.bounty)} cr` : "");
  const vr = d.vr;  // only worth space when something has gone wrong
  $("vr").hidden = !(vr && (vr.tracking_now === "paused" || vr.pauses_this_run));
  if (vr) $("vr").innerHTML = vr.tracking_now === "paused" ? `<span class="urgent">VR tracking paused</span>` : `VR tracking paused ${num(vr.pauses_this_run)} times this run`;
  const s = d.ship;
  $("shipname").textContent = s.name || "";
  $("shiptype").textContent = s.type || "";
  $("hullbig").textContent = s.hull == null ? "-" : Math.round(s.hull * 100) + "%";
  $("hullv").textContent = s.hull == null ? "-" : Math.round(s.hull * 100) + "%";
  arc("hullarc", s.hull, true);
  $("fuelv").textContent = s.fuel == null ? "-" : `${s.fuel.toFixed(1)} / ${num(s.fuel_capacity)} t`;
  arc("fuelarc", s.fuel / (s.fuel_capacity || 1), true);
  $("cargov").textContent = `${num(s.cargo_used)} / ${num(s.cargo_capacity)} t`;
  arc("cargoarc", s.cargo_used / (s.cargo_capacity || 1), false);  // a full hold isn't a warning
  $("jump").textContent = s.jump_range ? s.jump_range.toFixed(1) + " ly" : "-";
  $("rebuy").textContent = num(s.rebuy) + " cr";
  $("pips").innerHTML = [["sys", "Sys"], ["eng", "Eng"], ["wep", "Wep"]].map(([k, name]) => {
    const v = d.pips[k] || 0;
    const blocks = Array.from({length: 4}, (_, i) => `<b class="${v >= (i + 1) * 2 ? "on" : v > i * 2 ? "half" : ""}"></b>`).join("");
    return `<div class="pip"><div class="stack">${blocks}</div>${name} ${v / 2}</div>`;
  }).join("");
  show("route", d.route.length && `<div class="dim">${d.route.length} jump${d.route.length > 1 ? "s" : ""} left</div><ol>` + d.route.slice(0, 8).map(r =>
      `<li>${esc(r.system)}<span class="star${r.scoop ? " scoop" : ""}">${r.scoop ? "Fuel star" : r.star ? esc(r.star) + " star" : ""}</span></li>`).join("") +
      (d.route.length > 8 ? `<li class="dim">And ${d.route.length - 8} more</li>` : "") + "</ol>");
  show("mission", d.missions.length && d.missions.map(m => {
    const ready = m.status.startsWith("ready"), sl = m.seconds_left;
    const cls = ready ? "ready" : sl != null && sl < 900 ? "urgent" : sl != null && sl < 3600 ? "soon" : "dim";
    const when = ready ? "Ready" : m.status.startsWith("MISSION CARGO LOST") ? "Cargo lost" : left(sl);
    return `<div class="mission"><div class="row"><span>${esc(m.name)}</span><span class="when ${cls}">${esc(when)}</span></div><div class="dim">${esc(m.where)}</div></div>`;
  }).join(""));
  const mi = d.mining;
  $("miningbox").hidden = !mi;
  if (mi) {
    const p = mi.last_prospect;
    const refined = Object.entries(mi.refined_tons || {}).sort((a, b) => b[1] - a[1]);
    $("mining").innerHTML =
      `<div class="row"><span>${esc(mi.where || "")}</span><span>${num(mi.minutes)} min</span></div>` +
      `<div class="row"><span>Refined</span><span>${num(mi.total_tons)} t, ${num(mi.tons_per_hour)} t/h</span></div>` +
      refined.map(([n, c]) => `<div class="row dim"><span>${esc(n)}</span><span>${num(c)} t</span></div>`).join("") +
      `<div class="row"><span>Limpets left</span><span class="${mi.limpets_left <= 5 ? "urgent" : ""}">${num(mi.limpets_left)}</span></div>` +
      (p ? `<div class="dim">Last rock: ${esc(p.content || "")}${p.core ? ", core " + esc(p.core) : ""}</div>` +
           Object.entries(p.materials || {}).sort((a, b) => b[1] - a[1]).map(([n, v]) =>
             `<div class="row"><span>${esc(n)}</span><span>${v.toFixed(1)}%</span></div>`).join("") : "");
  }
  const hold = Object.entries(d.cargo || {}).filter(([, c]) => c), mc = d.mission_cargo || [];
  show("hold", (hold.length || mc.length) && hold.map(([n, c]) => `<div class="row"><span>${esc(n)}</span><span>${num(c)}</span></div>`).join("") +
    mc.map(c => `<div class="row"><span>${esc(c.commodity)} <span class="dim">(mission)</span></span><span>${num(c.count)}</span></div>`).join(""));
  const conv = $("conv");
  const atBottom = conv.scrollTop + conv.clientHeight >= conv.scrollHeight - 8;
  conv.innerHTML = d.conversation.length ? d.conversation.map(line => {
    const m = line.match(/^(\S+) ([^:]+): ([\s\S]*)$/);  // "21:04 Vesper: ...", whoever's speaking
    if (!m) return `<p>${esc(line)}</p>`;
    const cls = m[2] === "Vesper" ? "" : m[2] === "Callout" ? "callout" : "you";
    return `<p class="${cls}"><time>${esc(m[1])}</time>${esc(m[3])}</p>`;
  }).join("") : `<p class="empty">Nothing said in the last 45 minutes</p>`;
  if (atBottom) conv.scrollTop = conv.scrollHeight;
}
let lastOk = 0;
async function tick() {
  try {
    const r = await fetch("/api/state", {cache: "no-store"});
    render(await r.json());
    lastOk = Date.now();
  } catch (e) { /* keep the last picture; the status says so */ }
  const live = lastOk && (Date.now() - lastOk) / 1000 < 6;
  $("stale").textContent = live ? "Live" : "Can't reach Vesper";
  $("stale").className = live ? "" : "bad";
  $("core").className = "core " + (live ? "live" : "lost");
}
tick();
setInterval(tick, 2000);

// ---- settings ----
const SLIDERS = new Set(["voice.rate", "voice.volume"]);
const shown = v => v == null ? "" : typeof v === "boolean" ? (v ? "on" : "off") : Array.isArray(v) ? v.join(", ") : v;
function option(c, value) { return `<option value="${esc(c.value)}"${c.value === value ? " selected" : ""}>${esc(c.label)}</option>`; }
function control(f, editable) {
  const off = editable ? "" : " disabled";
  const id = esc("set-" + f.key);
  if (f.kind === "bool") return `<input type="checkbox" id="${id}"${f.value ? " checked" : ""}${off}>`;
  if (f.choices) {
    const piper = f.choices.filter(c => c.label.startsWith("Piper "));
    const rest = f.choices.filter(c => !c.label.startsWith("Piper "));
    return `<select id="${id}"${off}>` + (piper.length
      ? `<optgroup label="Windows">${rest.map(c => option(c, f.value)).join("")}</optgroup><optgroup label="Piper">${piper.map(c => option(c, f.value)).join("")}</optgroup>`
      : rest.map(c => option(c, f.value)).join("")) + "</select>";
  }
  const range = (f.min != null ? ` min="${f.min}"` : "") + (f.max != null ? ` max="${f.max}"` : "") + (f.kind === "float" ? ' step="any"' : "");
  if (SLIDERS.has(f.key)) return `<input type="range" id="${id}" value="${esc(f.value)}"${range}${off}><output>${esc(f.value)}</output>`;
  return `<input type="${f.kind === "int" || f.kind === "float" ? "number" : "text"}" id="${id}" value="${esc(f.value)}"${range}${off}>`;
}
function fieldHtml(f, editable, said, bad) {
  return `<div class="set" data-key="${esc(f.key)}" data-kind="${esc(f.kind)}">
    <div><label for="${esc("set-" + f.key)}">${esc(f.label)}</label>
      ${f.help ? `<small>${esc(f.help)}</small>` : ""}${f.note ? `<small>${esc(f.note)}</small>` : ""}</div>
    <div class="how">${control(f, editable)}</div>
    ${f.running !== undefined ? `<small class="said later">Running ${esc(shown(f.running))} until Vesper restarts</small>` : ""}
    ${said ? `<small class="said ${bad ? "err" : "ok"}">${esc(said)}</small>` : ""}
  </div>`;
}
let settingsState = null, openGroup = 0;
function drawSettings() {
  const s = settingsState, g = s.groups[openGroup] || s.groups[0];
  const notice = s.pc_only ? "Settings can only be changed on the PC running Vesper." : !s.editable ? "Settings are read-only." : !s.vesper ? "Vesper isn't running. Changes apply when she starts." : "";
  $("settings").innerHTML =
    `<nav class="rail" aria-label="Settings groups">${s.groups.map((x, i) => `<button type="button" data-group="${i}" aria-current="${x === g}">${esc(x.title)}</button>`).join("")}</nav>
     <section class="pane"><h2>${esc(g.title)}</h2>${notice ? `<p class="notice">${esc(notice)}</p>` : ""}${g.fields.map(f => fieldHtml(f, s.editable)).join("")}</section>`;
}
async function openSettings(refresh) {
  try {
    const r = await fetch("/api/settings" + (refresh ? "?refresh=1" : ""), {cache: "no-store"});
    settingsState = await r.json();
    if (settingsState.error) throw new Error(settingsState.error);
  } catch (e) {
    $("settings").innerHTML = `<p class="notice">Couldn't read the settings: ${esc(e.message)}</p>`;
    return;
  }
  drawSettings();
}
$("settings").addEventListener("click", e => {
  const b = e.target.closest("[data-group]");
  if (b) { openGroup = Number(b.dataset.group); drawSettings(); }
});
$("settings").addEventListener("input", e => {
  if (e.target.type === "range") e.target.nextElementSibling.textContent = e.target.value;
});
$("settings").addEventListener("change", async e => {
  const row = e.target.closest(".set");
  if (!row) return;
  const kind = row.dataset.kind, key = row.dataset.key;
  const value = kind === "bool" ? e.target.checked : kind === "int" || kind === "float" ? Number(e.target.value) : e.target.value;
  const field = settingsState.groups.flatMap(g => g.fields).find(f => f.key === key);
  const redraw = (f, said, bad) => {
    row.outerHTML = fieldHtml(f, settingsState.editable, said, bad);
    document.getElementById("set-" + key)?.focus();
    if (!bad) setTimeout(() => document.querySelector(`.set[data-key="${CSS.escape(key)}"] .ok`)?.remove(), 4000);
  };
  if ((kind === "int" || kind === "float") && e.target.value.trim() === "") { redraw(field, "That needs a number.", true); return; }
  try {
    const r = await fetch("/api/settings", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({key, value})});
    const d = await r.json();
    if (d.error) { redraw(field, d.error, true); return; }
    delete field.running;
    Object.assign(field, d.field);
    redraw(field, d.message, false);
  } catch (err) { redraw(field, "Couldn't reach Vesper, so nothing was saved.", true); }
});
function route() {
  const open = location.hash === "#settings";
  $("settings").hidden = !open;
  $("cockpit").hidden = open;
  $("gear").textContent = open ? "Cockpit" : "Settings";
  if (open) openSettings(true);
}
$("gear").addEventListener("click", () => { location.hash = location.hash === "#settings" ? "" : "#settings"; });
addEventListener("hashchange", route);
route();
</script>
</body>

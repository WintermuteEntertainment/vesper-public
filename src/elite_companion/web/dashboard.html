<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cockpit</title>
<style>
  :root {
    --bg: #07090c; --panel: #0f1318; --line: #1f2731; --text: #e8e2d6; --dim: #8b8579;
    --hud: #ff8c1a; --hud-dim: #7a4510; --good: #5fd38d; --warn: #ffcc4d; --bad: #ff5a4f; --blue: #6cc4ff;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 16px/1.35 "Segoe UI", system-ui, sans-serif; }
  header { display: flex; flex-wrap: wrap; gap: 4px 18px; align-items: baseline; padding: 12px 16px;
           border-bottom: 1px solid var(--line); }
  header h1 { margin: 0; font-size: 22px; color: var(--hud); letter-spacing: .04em; }
  header .sub { color: var(--dim); }
  #stale { margin-left: auto; color: var(--dim); font-size: 13px; }
  #stale.bad { color: var(--bad); }
  main { display: grid; gap: 12px; padding: 12px 16px 24px;
         grid-template-columns: repeat(auto-fill, minmax(min(100%, 330px), 1fr)); }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; min-width: 0; }
  h2 { margin: 0 0 8px; font-size: 13px; text-transform: uppercase; letter-spacing: .12em; color: var(--hud); font-weight: 600; }
  .big { font-size: 24px; font-weight: 600; }
  .dim { color: var(--dim); }
  .row { display: flex; justify-content: space-between; gap: 10px; padding: 3px 0; }
  .row span:last-child { text-align: right; font-variant-numeric: tabular-nums; }
  .bar { height: 10px; background: #1a2028; border-radius: 5px; overflow: hidden; margin: 4px 0 8px; }
  .bar i { display: block; height: 100%; background: var(--hud); border-radius: 5px; transition: width .4s; }
  .bar.good i { background: var(--good); } .bar.warn i { background: var(--warn); } .bar.bad i { background: var(--bad); }
  .pips { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; text-align: center; }
  .pips .stack { display: flex; flex-direction: column-reverse; gap: 3px; height: 64px; margin: 4px auto; width: 30px; }
  .pips .stack b { flex: 1; background: #1a2028; border-radius: 2px; }
  .pips .stack b.on { background: var(--blue); }
  ol, ul { margin: 0; padding-left: 20px; }
  li { padding: 2px 0; overflow-wrap: anywhere; }
  .scoop { color: var(--good); font-size: 12px; margin-left: 6px; }
  .noscoop { color: var(--dim); font-size: 12px; margin-left: 6px; }
  .mission { padding: 6px 0; border-top: 1px solid var(--line); }
  .mission:first-child { border-top: 0; }
  .mission .when { font-variant-numeric: tabular-nums; }
  .soon { color: var(--warn); } .urgent { color: var(--bad); font-weight: 600; } .ready { color: var(--good); }
  .threat { color: var(--bad); }
  .conv { font-size: 14px; max-height: 320px; overflow: auto; }
  .conv div { padding: 2px 0; overflow-wrap: anywhere; }
  .conv .cmdr { color: var(--blue); } .conv .callout { color: var(--warn); }
  .empty { color: var(--dim); font-style: italic; }
  .flags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .flags span { font-size: 12px; padding: 2px 8px; border-radius: 10px; border: 1px solid var(--hud-dim); color: var(--hud); }
</style>
</head>
<body>
<header>
  <h1 id="cmdr">CMDR</h1>
  <span class="sub" id="credits"></span>
  <span class="sub" id="legal"></span>
  <span id="stale">connecting…</span>
</header>
<main>
  <section><h2>Location</h2><div class="big" id="system">—</div><div id="where" class="dim"></div><div class="flags" id="flags"></div></section>
  <section><h2>Ship</h2>
    <div class="big" id="shipname">—</div><div class="dim" id="shiptype"></div>
    <div class="row"><span>Hull</span><span id="hullv"></span></div><div class="bar" id="hull"><i></i></div>
    <div class="row"><span>Fuel</span><span id="fuelv"></span></div><div class="bar" id="fuel"><i></i></div>
    <div class="row"><span>Cargo</span><span id="cargov"></span></div><div class="bar" id="cargo"><i></i></div>
    <div class="row dim"><span>Jump range</span><span id="jump"></span></div>
    <div class="row dim"><span>Rebuy</span><span id="rebuy"></span></div>
  </section>
  <section><h2>Power distributor</h2><div class="pips" id="pips"></div></section>
  <section><h2>Route</h2><div id="route"></div></section>
  <section><h2>Missions</h2><div id="missions"></div></section>
  <section><h2>Threats</h2><div id="threat"></div></section>
  <section id="miningbox" hidden><h2>Mining</h2><div id="mining"></div></section>
  <section><h2>Hold</h2><div id="hold"></div></section>
  <section><h2>Vesper</h2><div class="conv" id="conv"></div></section>
</main>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const num = n => n == null ? "—" : Math.round(n).toLocaleString();
function bar(id, frac) {
  const f = Math.max(0, Math.min(1, frac || 0));
  const el = $(id);
  el.querySelector("i").style.width = (f * 100) + "%";
  el.className = "bar " + (f < 0.25 ? "bad" : f < 0.5 ? "warn" : "good");
}
function left(sec) {
  if (sec == null) return "";
  if (sec <= 0) return "expired";
  const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60);
  return h ? `${h}h ${m}m` : `${m}m`;
}
function render(d) {
  if (d.error) { $("stale").textContent = d.error; return; }
  $("cmdr").textContent = "CMDR " + d.commander;
  $("credits").textContent = num(d.credits) + " cr";
  $("legal").textContent = d.legal || "";
  $("system").textContent = d.location.system || "—";
  $("where").textContent = [d.location.where, d.location.mode].filter(Boolean).join(" · ");
  const shown = ["Docked", "Supercruise", "LowFuel", "OverHeating", "BeingInterdicted", "IsInDanger", "FsdCharging", "Landed"];
  $("flags").innerHTML = (d.flags || []).filter(f => shown.includes(f)).map(f => `<span>${esc(f)}</span>`).join("");
  const s = d.ship;
  $("shipname").textContent = s.name || "—";
  $("shiptype").textContent = s.type || "";
  $("hullv").textContent = s.hull == null ? "—" : Math.round(s.hull * 100) + "%";
  bar("hull", s.hull);
  $("fuelv").textContent = s.fuel == null ? "—" : `${s.fuel.toFixed(1)} / ${num(s.fuel_capacity)} t`;
  bar("fuel", s.fuel / (s.fuel_capacity || 1));
  $("cargov").textContent = `${num(s.cargo_used)} / ${num(s.cargo_capacity)} t`;
  bar("cargo", s.cargo_used / (s.cargo_capacity || 1));
  $("cargo").className = "bar";  // a full hold isn't a warning
  $("jump").textContent = s.jump_range ? s.jump_range.toFixed(1) + " ly" : "—";
  $("rebuy").textContent = num(s.rebuy) + " cr";
  $("pips").innerHTML = ["sys", "eng", "wep"].map(k => {
    const v = d.pips[k] || 0;
    const blocks = Array.from({length: 4}, (_, i) => `<b class="${v >= (i + 1) * 2 ? "on" : ""}"></b>`).join("");
    return `<div><div class="stack">${blocks}</div><div class="dim">${k.toUpperCase()} ${v / 2}</div></div>`;
  }).join("");
  $("route").innerHTML = d.route.length
    ? `<div class="dim">${d.route.length} jump${d.route.length > 1 ? "s" : ""} left</div><ol>` + d.route.slice(0, 12).map(r =>
        `<li>${esc(r.system)}<span class="${r.scoop ? "scoop" : "noscoop"}">${esc(r.star || "?")}${r.scoop ? " ⛽" : ""}</span></li>`).join("") +
      (d.route.length > 12 ? `<li class="dim">…and ${d.route.length - 12} more</li>` : "") + "</ol>"
    : `<div class="empty">No route plotted</div>`;
  $("missions").innerHTML = d.missions.length ? d.missions.map(m => {
    const cls = m.status.startsWith("ready") ? "ready" : m.seconds_left != null && m.seconds_left < 900 ? "urgent"
              : m.seconds_left != null && m.seconds_left < 3600 ? "soon" : "dim";
    const when = m.status.startsWith("ready") ? "ready to turn in" : m.status.startsWith("MISSION CARGO LOST") ? "cargo lost" : left(m.seconds_left);
    return `<div class="mission"><div>${esc(m.name)}</div><div class="row"><span class="dim">${esc(m.where)}</span><span class="when ${cls}">${esc(when)}</span></div></div>`;
  }).join("") : `<div class="empty">No active missions</div>`;
  const t = d.target;
  $("threat").innerHTML = (d.threat ? `<div class="threat">${esc(d.threat)}</div>` : `<div class="empty">All quiet</div>`) +
    (t ? `<div class="row"><span>Target</span><span>${esc([t.pilot, t.ship, t.rank].filter(Boolean).join(" · "))}</span></div>` +
         (t.bounty ? `<div class="row dim"><span>Bounty</span><span>${num(t.bounty)} cr</span></div>` : "") : "");
  const mi = d.mining;
  $("miningbox").hidden = !mi;
  if (mi) {
    const p = mi.last_prospect;
    const refined = Object.entries(mi.refined_tons || {}).sort((a, b) => b[1] - a[1]);
    $("mining").innerHTML =
      `<div class="row"><span>${esc(mi.where || "")}</span><span>${num(mi.minutes)} min</span></div>` +
      `<div class="row"><span>Refined</span><span>${num(mi.total_tons)} t · ${num(mi.tons_per_hour)} t/h</span></div>` +
      refined.map(([n, c]) => `<div class="row dim"><span>${esc(n)}</span><span>${num(c)} t</span></div>`).join("") +
      `<div class="row"><span>Limpets left</span><span class="${mi.limpets_left <= 5 ? "urgent" : ""}">${num(mi.limpets_left)}</span></div>` +
      `<div class="row dim"><span>Prospected / cores</span><span>${num(mi.asteroids_prospected)} / ${num(mi.cores_found)}</span></div>` +
      (p ? `<div class="dim" style="margin-top:6px">Last rock: ${esc(p.content || "")}${p.core ? " · core " + esc(p.core) : ""}</div>` +
           Object.entries(p.materials || {}).sort((a, b) => b[1] - a[1]).map(([n, v]) =>
             `<div class="row"><span>${esc(n)}</span><span>${v.toFixed(1)}%</span></div>`).join("") : "");
  }
  const hold = Object.entries(d.cargo || {}).filter(([, c]) => c);
  const mc = d.mission_cargo || [];
  $("hold").innerHTML = (hold.length || mc.length)
    ? hold.map(([n, c]) => `<div class="row"><span>${esc(n)}</span><span>${num(c)}</span></div>`).join("") +
      mc.map(c => `<div class="row"><span>${esc(c.commodity)} <span class="dim">(mission)</span></span><span>${num(c.count)}</span></div>`).join("")
    : `<div class="empty">Hold empty</div>`;
  const conv = $("conv");
  const atBottom = conv.scrollTop + conv.clientHeight >= conv.scrollHeight - 8;
  conv.innerHTML = d.conversation.length ? d.conversation.map(l => {
    const cls = l.includes(" Commander: ") ? "cmdr" : l.includes(" Callout: ") ? "callout" : "";
    return `<div class="${cls}">${esc(l)}</div>`;
  }).join("") : `<div class="empty">Nothing said in the last 45 minutes</div>`;
  if (atBottom) conv.scrollTop = conv.scrollHeight;
}
let lastOk = 0;
async function tick() {
  try {
    const r = await fetch("/api/state", {cache: "no-store"});
    render(await r.json());
    lastOk = Date.now();
  } catch (e) { /* keep the last picture; the stale marker says so */ }
  const age = (Date.now() - lastOk) / 1000;
  $("stale").textContent = lastOk && age < 6 ? "live" : "can't reach the co-pilot";
  $("stale").className = lastOk && age < 6 ? "" : "bad";
}
tick();
setInterval(tick, 2000);
</script>
</body>
</html>

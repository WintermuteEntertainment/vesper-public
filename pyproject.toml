[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vesper"
version = "0.1.0"
description = "Vesper: a voice co-pilot for Elite Dangerous"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=2.3,<3"]
voice = ["anthropic>=2.3", "pywin32", "sounddevice", "numpy", "faster-whisper"]

[project.scripts]
vesper = "elite_companion.__main__:main"
vesper-mcp = "elite_companion.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vesper"
version = "0.1.0a1"
description = "Vesper: a voice co-pilot for Elite Dangerous"
requires-python = ">=3.11"
license = {text = "GPL-3.0-only"}
classifiers = ["License :: OSI Approved :: GNU General Public License v3 (GPLv3)", "Operating System :: Microsoft :: Windows"]
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=2.3,<3"]
voice = ["anthropic>=2.3", "pywin32", "sounddevice", "numpy", "faster-whisper"]
piper = ["piper-tts>=1.8,<2"]  # optional offline voices; Piper itself is GPL-3.0

[project.scripts]
vesper = "elite_companion.__main__:main"
vesper-mcp = "elite_companion.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
elite_companion = ["data/*.json", "web/*.html", "locales/*.json"]
